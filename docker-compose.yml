# docker compose 相比裸 docker run 的好处:把"镜像名、env-file、volume 挂载"这些
# 固定配置写死在文件里, 每次只需 `docker compose run --rm jdscout <参数>`, 不用手敲一长串。
services:
  jdscout:
    build: .
    image: jdscout
    # API key 运行时从 .env 注入, 不进镜像(见 Dockerfile / .dockerignore)。
    env_file:
      - .env
    # 把宿主机的 examples/ 挂到容器 /data, 简历从这里读、报告往这里写。
    volumes:
      - ./examples:/data
    # 覆盖默认(空)命令。实际用时在命令行追加参数即可, 例如:
    #   docker compose run --rm jdscout \
    #     --jd "..." --resume /data/sample_resume.pdf --output /data/report.json
