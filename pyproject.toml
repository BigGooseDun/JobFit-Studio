[project]
name = "jdscout"
version = "0.1.0"
description = "AI-powered JD analysis agent for job seekers"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "playwright>=1.40",
    # torch 显式列为直接依赖, 才能让下面的 [tool.uv.sources] CPU 覆盖生效
    # (它本是 sentence-transformers 的传递依赖, 传递依赖不吃 sources 覆盖)。
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdscout"]

# 在 Linux(Docker)上用 CPU 版 torch, 避免默认拉几 GB 的 CUDA/nvidia 包(我们不用 GPU)。
# 加了这条后镜像从 ~10GB 降到 ~2GB。Mac 不受影响(marker 只匹配 linux, 走默认 wheel)。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
